<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ business.name }} – Support</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="--brand: {{ business.theme_color }}">

<div class="chat-container">

    <header>
        <h1>{{ business.name }}</h1>
        <div class="header-actions">
            <button type="button" class="secondary" id="summary-btn">Summary</button>
            <button type="button" class="secondary" id="reset-btn">New chat</button>
        </div>
    </header>

    <nav class="business-switcher" aria-label="Demo businesses">
        Demo business:
        {% for b in businesses %}
            <a href="{{ url_for('chat_page', business_id=b.id) }}"{% if b.id == business.id %} aria-current="page"{% endif %}>{{ b.name }}</a>
        {% endfor %}
    </nav>

    <div id="chat-box" aria-live="polite"></div>

    <form class="input-area" id="chat-form">
        <input type="text" id="user-input" placeholder="Type message..." maxlength="1000" autocomplete="off">
        <button type="submit" id="send-btn">Send</button>
    </form>

</div>

<script>
const BUSINESS_ID = {{ business.id | tojson }};
const chatBox = document.getElementById("chat-box");
const form = document.getElementById("chat-form");
const inputField = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");

// All text is inserted with textContent, never innerHTML, so user or model
// output can never inject markup or scripts into the page.
function addMessage(text, cls, badge, meta) {
    const div = document.createElement("div");
    div.className = cls;
    div.textContent = text;
    if (badge) {
        const tag = document.createElement("div");
        tag.className = "badge";
        tag.textContent = badge;
        div.appendChild(tag);
    }
    if (meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta;
        div.appendChild(m);
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

async function sendMessage(message) {
    message = message.trim();
    if (!message) return;

    addMessage(message, "user-message");
    inputField.value = "";
    inputField.disabled = sendBtn.disabled = true;
    const loading = addMessage("Typing...", "bot-message loading");

    try {
        const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, business: BUSINESS_ID })
        });
        const data = await res.json();
        loading.remove();
        if (!res.ok) {
            addMessage(data.error || "Something went wrong. Please try again.", "bot-message error");
        } else {
            // Routing trace: what happened, who decided it, and how confident the classifier was.
            const meta = [data.route, data.source, data.confidence != null ? data.confidence.toFixed(2) : null]
                .filter(Boolean).join(" · ");
            addMessage(data.response, "bot-message", data.escalated ? "Escalated: " + data.reason : null, meta);
        }
    } catch (err) {
        loading.remove();
        addMessage("Network error. Please check your connection and try again.", "bot-message error");
    } finally {
        inputField.disabled = sendBtn.disabled = false;
        inputField.focus();
    }
}

form.addEventListener("submit", (e) => {
    e.preventDefault();
    sendMessage(inputField.value);
});

document.getElementById("summary-btn").addEventListener("click", () => sendMessage("summary"));

document.getElementById("reset-btn").addEventListener("click", async () => {
    await fetch("/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ business: BUSINESS_ID })
    });
    chatBox.replaceChildren();
    inputField.focus();
});
</script>

</body>
</html>
