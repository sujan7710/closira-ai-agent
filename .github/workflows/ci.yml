name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate business configs
        run: python -c "from business import BUSINESSES; print('Loaded:', ', '.join(BUSINESSES))"
      - name: Run tests (offline, LLM faked)
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t closira-agent .
      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 \
            -e GROQ_API_KEY=dummy -e FLASK_SECRET_KEY=ci-secret -e ADMIN_PASSWORD=ci-admin \
            closira-agent
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -o /dev/null http://127.0.0.1:8000/b/bloom
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/admin)" = "401"
      - name: Container logs
        if: always()
        run: docker logs app || true
